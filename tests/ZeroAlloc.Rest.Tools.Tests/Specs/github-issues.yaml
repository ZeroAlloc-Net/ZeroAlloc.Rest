    nullable-integration:
      title: GitHub app
      description: GitHub apps are a new way to extend GitHub. They can be installed
        directly on organizations and user accounts and granted access to specific
        repositories. They come with granular permissions and built-in webhooks. GitHub
        apps are first class actors within GitHub.
      type: object
      nullable: true
      properties:
        id:
          description: Unique identifier of the GitHub app
          type: integer
        slug:
          description: The slug name of the GitHub app
          type: string
        node_id:
          type: string
        client_id:
          type: string
        owner:
          oneOf:
          - $ref: '#/components/schemas/simple-user'
          - $ref: '#/components/schemas/enterprise'
        name:
          description: The name of the GitHub app
          type: string
        description:
          type: string
          nullable: true
        external_url:
          type: string
          format: uri
        html_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        permissions:
          description: The set of permissions for the GitHub app
          type: object
          properties:
            issues:
              type: string
            checks:
              type: string
            metadata:
              type: string
            contents:
              type: string
            deployments:
              type: string
          additionalProperties:
            type: string
        events:
          description: The list of events for the GitHub app. Note that the `installation_target`,
            `security_advisory`, and `meta` events are not included because they are
            global events and not specific to an installation.
          type: array
          items:
            type: string
        installations_count:
          description: The number of installations associated with the GitHub app.
            Only returned when the integration is requesting details about itself.
          type: integer
      required:
