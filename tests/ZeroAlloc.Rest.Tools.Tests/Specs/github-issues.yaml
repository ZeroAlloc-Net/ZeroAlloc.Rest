    pull-request-review-comment:
      title: Pull Request Review Comment
      description: Pull Request Review Comments are comments on a portion of the Pull
        Request's diff.
      type: object
      properties:
        url:
          description: URL for the pull request review comment
          type: string
        pull_request_review_id:
          description: The ID of the pull request review to which the comment belongs.
          type: integer
          format: int64
          nullable: true
        id:
          description: The ID of the pull request review comment.
          type: integer
          format: int64
        node_id:
          description: The node ID of the pull request review comment.
          type: string
        diff_hunk:
          description: The diff of the line that the comment refers to.
          type: string
        path:
          description: The relative path of the file to which the comment applies.
          type: string
        position:
          description: The line index in the diff to which the comment applies. This
            field is closing down; use `line` instead.
          type: integer
        original_position:
          description: The index of the original line in the diff to which the comment
            applies. This field is closing down; use `original_line` instead.
          type: integer
        commit_id:
          description: The SHA of the commit to which the comment applies.
          type: string
        original_commit_id:
          description: The SHA of the original commit to which the comment applies.
          type: string
        in_reply_to_id:
          description: The comment ID to reply to.
          type: integer
        user:
          $ref: '#/components/schemas/nullable-simple-user'
        body:
          description: The text of the comment.
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        html_url:
          description: HTML URL for the pull request review comment.
          type: string
          format: uri
        pull_request_url:
          description: URL for the pull request that the review comment belongs to.
          type: string
          format: uri
        author_association:
          $ref: '#/components/schemas/author-association'
        _links:
          type: object
          properties:
            self:
              type: object
              properties:
                href:
                  type: string
                  format: uri
              required:
              - href
            html:
              type: object
              properties:
                href:
                  type: string
                  format: uri
              required:
              - href
            pull_request:
              type: object
              properties:
                href:
                  type: string
                  format: uri
              required:
              - href
          required:
          - self
          - html
          - pull_request
        start_line:
          type: integer
          description: The first line of the range for a multi-line comment.
          nullable: true
        original_start_line:
          type: integer
          description: The first line of the range for a multi-line comment.
          nullable: true
        start_side:
          type: string
          description: The side of the first line of the range for a multi-line comment.
          enum:
          - LEFT
          - RIGHT
          default: RIGHT
          nullable: true
        line:
          description: The line of the blob to which the comment applies. The last
            line of the range for a multi-line comment
          type: integer
        original_line:
          description: The line of the blob to which the comment applies. The last
            line of the range for a multi-line comment
          type: integer
        side:
          description: The side of the diff to which the comment applies. The side
            of the last line of the range for a multi-line comment
          enum:
          - LEFT
          - RIGHT
          default: RIGHT
          type: string
        subject_type:
          description: The level at which the comment is targeted, can be a diff line
            or a file.
          type: string
          enum:
          - line
