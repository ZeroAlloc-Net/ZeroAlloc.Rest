name: Release Please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

# One run at a time. Two quick pushes to main would otherwise run release-please and
# ship-release-tracking concurrently against the same release PR branch. Queued, not
# cancelled: a cancelled run could drop a release or its publish.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # Read by ship-release-tracking. A step output is only visible to another job
      # when the job re-exports it here; without these the job's `if:` is always false.
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Marks the analyzer rules and public API that the pending release adds as shipped,
  # by committing the move onto the release PR branch. Merging that PR then lands the
  # move in the same commit that tags the release, so AnalyzerReleases.Shipped.md and
  # PublicAPI.Shipped.txt always say what each published version contains. Without it
  # nothing was ever marked shipped, so the analyzers could not flag a change to a
  # shipped rule or a shipped API. Shared from ZeroAlloc-Net/.github; see
  # ZeroAlloc-Net/.github#38. release-please rebuilds its branch from main whenever
  # main moves, dropping this commit; the job then runs again in the same workflow run
  # and re-applies it. It commits nothing when nothing is unshipped.
  ship-release-tracking:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    uses: ZeroAlloc-Net/.github/.github/workflows/ship-release-tracking.yml@main
    with:
      branch: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    secrets:
      # Same token as release-please, so this push triggers the PR's checks exactly
      # as release-please's own push does. Empty falls back to GITHUB_TOKEN.
      RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Restore
        run: dotnet restore ZeroAlloc.Rest.slnx

      - name: Build
        run: dotnet build ZeroAlloc.Rest.slnx --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

      # DuplicateGeneratorDiagnosticTests scaffolds a consumer project that restores
      # ZeroAlloc.Rest and ZeroAlloc.Rest.Generator from a local feed, and asserts the
      # build fails with ZR9001. Without this step the feed does not exist and the test
      # fails on its first assertion — which is what stranded v1.2.2 and v1.3.0: the
      # release was tagged, the publish job died here, and nothing reached NuGet.
      # ci.yml has always had this step; the publish job never did.
      #
      # --no-build, unlike ci.yml's copy: a plain `dotnet pack` here would rebuild these
      # projects at the default version and overwrite the output the Pack step below
      # publishes with --no-build, shipping assemblies stamped 1.0.0 inside a package
      # labelled with the real version.
      - name: Pack ZA.Rest packages into local feed (for duplicate-generator test)
        run: |
          dotnet pack src/ZeroAlloc.Rest/ZeroAlloc.Rest.csproj --no-build -c Release -p:PackageVersion=${{ steps.version.outputs.version }} -o artifacts/local
          dotnet pack src/ZeroAlloc.Rest.Generator/ZeroAlloc.Rest.Generator.csproj --no-build -c Release -p:PackageVersion=${{ steps.version.outputs.version }} -o artifacts/local

      - name: Test
        run: dotnet test ZeroAlloc.Rest.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack ZeroAlloc.Rest.slnx --no-build -c Release -p:Version=${{ steps.version.outputs.version }} -o ./nupkg

      - name: Push to NuGet (stable)
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
