name: CI

on:
  push:
    branches: [ main, 'release-please--**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Run GitVersion
        id: gitversion
        run: |
          VERSION=$(dotnet tool run dotnet-gitversion /output json /showvariable SemVer)
          echo "semver=$VERSION" >> $GITHUB_OUTPUT
          echo "Computed version: $VERSION"

      - name: Restore
        run: dotnet restore ZeroAlloc.Rest.slnx

      - name: Build
        run: dotnet build ZeroAlloc.Rest.slnx --no-restore -c Release -p:Version=${{ steps.gitversion.outputs.semver }}

      # Read by the tests that build a consumer project against the packages: the duplicate-generator
      # test, the ZeroAlloc.Rest.Tools.MSBuild end-to-end test, and the package dependency and
      # core-only/DI consumer tests, which need the DI package alongside core.
      #
      # --no-build and the build's version, as in release-please.yml. A plain `dotnet pack` here
      # rebuilt these projects at the default 1.0.0 over the Build step's output, so the tests and
      # the Pack step below ran against assemblies stamped 1.0.0. The version guard in
      # Directory.Build.props now fails such a pack; see ZeroAlloc-Net/.github#36.
      - name: Pack ZA.Rest packages into local feed (for the package consumer tests)
        run: |
          dotnet pack src/ZeroAlloc.Rest/ZeroAlloc.Rest.csproj --no-build -c Release -p:Version=${{ steps.gitversion.outputs.semver }} -o artifacts/local
          dotnet pack src/ZeroAlloc.Rest.Generator/ZeroAlloc.Rest.Generator.csproj --no-build -c Release -p:Version=${{ steps.gitversion.outputs.semver }} -o artifacts/local
          dotnet pack src/ZeroAlloc.Rest.Tools.MSBuild/ZeroAlloc.Rest.Tools.MSBuild.csproj --no-build -c Release -p:Version=${{ steps.gitversion.outputs.semver }} -o artifacts/local
          dotnet pack src/ZeroAlloc.Rest.DependencyInjection/ZeroAlloc.Rest.DependencyInjection.csproj --no-build -c Release -p:Version=${{ steps.gitversion.outputs.semver }} -o artifacts/local

      - name: Test
        run: dotnet test ZeroAlloc.Rest.slnx --no-build -c Release --logger "trx" --results-directory ./test-results

      # The core-only consumer under JIT: ZeroAlloc.Rest without the DI package; see #336.
      - name: Run core-only consumer (JIT)
        run: dotnet run --no-build -c Release --project samples/ZeroAlloc.Rest.CoreOnly.AotSmoke

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./test-results

      - name: Pack
        run: dotnet pack ZeroAlloc.Rest.slnx --no-build -c Release -p:Version=${{ steps.gitversion.outputs.semver }} -o ./nupkg

  api-compat:
    uses: ZeroAlloc-Net/.github/.github/workflows/api-compat.yml@main

  aot-smoke:
    runs-on: ubuntu-latest
    # A typical run takes about a minute; a hung publish or smoke fails well before the default six hours.
    timeout-minutes: 15
    # Publishes samples/ZeroAlloc.Rest.AotSmoke with PublishAot=true and fails on any trim or AOT
    # warning. Verifies the generator-emitted REST client types survive ILC, resolves clients
    # through both the generated Add{I} and the Resilience bridge, and sends real requests over a
    # loopback socket through a client generated from petstore.yaml and its generated JSON context.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Install AOT native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore samples/ZeroAlloc.Rest.AotSmoke/ZeroAlloc.Rest.AotSmoke.csproj

      - name: Publish AOT
        # The smoke must publish with no trim or AOT warning at all; see #351.
        run: |
          set -o pipefail
          dotnet publish samples/ZeroAlloc.Rest.AotSmoke/ZeroAlloc.Rest.AotSmoke.csproj -r linux-x64 -c Release -o ./aot-out 2>&1 | tee publish.log
          if grep -E "warning IL[0-9]+" publish.log; then
            echo "::error::The AOT smoke has trim or AOT warnings."
            exit 1
          fi

      - name: Run AOT binary
        # A hang is killed after two minutes and fails the step with exit code 124.
        run: timeout --kill-after=10s 120s ./aot-out/ZeroAlloc.Rest.AotSmoke

  aot-smoke-core:
    runs-on: ubuntu-latest
    # A typical run takes about a minute; a hung publish or smoke fails well before the default six hours.
    timeout-minutes: 15
    # Publishes samples/ZeroAlloc.Rest.CoreOnly.AotSmoke with PublishAot=true and fails on any trim
    # or AOT warning. Proves that ZeroAlloc.Rest core alone, without
    # ZeroAlloc.Rest.DependencyInjection, still produces a generated client that survives ILC; see
    # #336.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Install AOT native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore samples/ZeroAlloc.Rest.CoreOnly.AotSmoke/ZeroAlloc.Rest.CoreOnly.AotSmoke.csproj

      - name: Publish AOT
        run: |
          set -o pipefail
          dotnet publish samples/ZeroAlloc.Rest.CoreOnly.AotSmoke/ZeroAlloc.Rest.CoreOnly.AotSmoke.csproj -r linux-x64 -c Release -o ./aot-core-out 2>&1 | tee publish.log
          if grep -E "warning IL[0-9]+" publish.log; then
            echo "::error::The core-only AOT smoke has trim or AOT warnings."
            exit 1
          fi

      - name: Run AOT binary
        # A hang is killed after two minutes and fails the step with exit code 124.
        run: timeout --kill-after=10s 120s ./aot-core-out/ZeroAlloc.Rest.CoreOnly.AotSmoke

  aot-smoke-memorypack:
    runs-on: ubuntu-latest
    # A typical run takes about a minute; a hung publish or smoke fails well before the default six hours.
    timeout-minutes: 15
    # Publishes samples/ZeroAlloc.Rest.MemoryPack.AotSmoke with PublishAot=true and runs it: the
    # Native AOT proof that MemoryPackRestSerializer's explicit type registration works without
    # MemoryPack's reflection-based formatter lookup, and that a missing registration is reported.
    # This job tolerates MemoryPack.Core's own trim and AOT warnings until upstream fixes them; see
    # #357, the tracking issue for MemoryPack.Core trim warnings. They stay in the log, one line per
    # member, and any IL warning that does not come from MemoryPack.Core fails the job.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Install AOT native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore samples/ZeroAlloc.Rest.MemoryPack.AotSmoke/ZeroAlloc.Rest.MemoryPack.AotSmoke.csproj

      - name: Publish AOT
        run: |
          set -o pipefail
          dotnet publish samples/ZeroAlloc.Rest.MemoryPack.AotSmoke/ZeroAlloc.Rest.MemoryPack.AotSmoke.csproj \
            -r linux-x64 -c Release -o ./aot-mp-out 2>&1 | tee aot-mp-publish.log

      - name: Only MemoryPack.Core IL warnings
        # The project sets TrimmerSingleWarn=false, so each warning names the member it comes from,
        # and a line is MemoryPack.Core's when that member is in the MemoryPack namespace.
        run: |
          foreign=$(grep -E "(warning|error) IL[0-9]+" aot-mp-publish.log \
            | grep -vE "(warning|error) IL[0-9]+: MemoryPack\.[A-Za-z]" || true)
          if [ -n "$foreign" ]; then
            echo "IL warnings that do not come from MemoryPack.Core:"
            echo "$foreign"
            exit 1
          fi
          echo "Every IL warning comes from MemoryPack.Core."

      - name: Run AOT binary
        # A hang is killed after two minutes and fails the step with exit code 124.
        run: timeout --kill-after=10s 120s ./aot-mp-out/ZeroAlloc.Rest.MemoryPack.AotSmoke

  aot-smoke-messagepack:
    runs-on: ubuntu-latest
    # A typical run takes about a minute; a hung publish or smoke fails well before the default six hours.
    timeout-minutes: 15
    # Publishes samples/ZeroAlloc.Rest.MessagePack.AotSmoke with PublishAot=true and runs it: the
    # Native AOT proof that MessagePackRestSerializer's resolver constructor works with a
    # source-generated resolver and never falls back to MessagePack's reflection-based resolvers.
    # This job tolerates MessagePack's own trim and AOT warnings until upstream fixes them; see #374.
    # They stay in the log, one line per member, and any IL warning that does not come from a
    # MessagePack member fails the job, so a warning from the smoke's code or from
    # ZeroAlloc.Rest.MessagePack does too.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Install AOT native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore samples/ZeroAlloc.Rest.MessagePack.AotSmoke/ZeroAlloc.Rest.MessagePack.AotSmoke.csproj

      - name: Publish AOT
        run: |
          set -o pipefail
          dotnet publish samples/ZeroAlloc.Rest.MessagePack.AotSmoke/ZeroAlloc.Rest.MessagePack.AotSmoke.csproj \
            -r linux-x64 -c Release -o ./aot-msgpack-out 2>&1 | tee aot-msgpack-publish.log

      - name: Only MessagePack IL warnings
        # The project sets TrimmerSingleWarn=false, so each warning names the member it comes from,
        # and a line is MessagePack's when that member is in the MessagePack namespace. The source
        # generator emits the smoke's formatters in the smoke's own namespace, so they are checked.
        run: |
          foreign=$(grep -E "(warning|error) IL[0-9]+" aot-msgpack-publish.log \
            | grep -vE "(warning|error) IL[0-9]+: MessagePack\.[A-Za-z]" || true)
          if [ -n "$foreign" ]; then
            echo "IL warnings that do not come from MessagePack:"
            echo "$foreign"
            exit 1
          fi
          echo "Every IL warning comes from MessagePack."

      - name: Run AOT binary
        # A hang is killed after two minutes and fails the step with exit code 124.
        run: timeout --kill-after=10s 120s ./aot-msgpack-out/ZeroAlloc.Rest.MessagePack.AotSmoke

  # A release PR must mark everything it releases as shipped: the analyzer rules in
  # AnalyzerReleases.Unshipped.md and the API in every PublicAPI.Unshipped.txt. The
  # ship-release-tracking job in release-please.yml commits that move onto the branch;
  # this fails the PR if the move is missing, or if a later commit on the branch adds
  # entries after it. Shared from ZeroAlloc-Net/.github; see ZeroAlloc-Net/.github#38.
  release-tracking:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    uses: ZeroAlloc-Net/.github/.github/workflows/release-tracking.yml@main
